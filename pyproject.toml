[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boiler-reviews"
version = "0.1.0"
description = "Course intelligence and constraint-based academic planning"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "integration: requires PostgreSQL or an explicitly configured integration database",
  "solver: runs constraint solver workloads",
  "e2e: runs browser-facing smoke checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.coverage.run]
branch = true
source = ["boiler_reviews"]
